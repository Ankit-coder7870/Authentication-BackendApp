
server.port=8082

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/auth_app
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=api.substring.com
security.jwt.access-ttl-seconds=600
security.jwt.refresh-ttl-seconds=86400
security.jwt.refresh-token-cookie-name=refreshToken
security.jwt.cookie-secure=true
security.jwt.cookie-http-only=true
security.jwt.cookie-same-site=Lax
security.jwt.cookie-domain=localhost

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#OAuth2 Configuration
#/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ===========================
# GitHub OAuth2
#/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.cors.front-end-url = http://localhost:5173

app.auth.frontend.success-redirect = http://localhost:5173/auth/success
app.auth.frontend.failure-redirect = http://localhost:5173/auth/failure
